name: Sicherheit täglich

# Der volle CI-Lauf hängt an Push und Pull Request. Ohne Commit entsteht damit
# eine Lücke: Ein Paket, das heute sauber ist, kann morgen eine Meldung haben,
# und ein Geheimnis in einem alten Commit bleibt unbemerkt, solange niemand
# etwas schiebt. Darum läuft diese Prüfung jeden Tag von selbst.
#
# Sie ist bewusst schmal — nur Secret-Scan und Abhängigkeiten, keine Builds,
# keine Browser-Tests. Ein täglicher Lauf, der zwanzig Minuten braucht, wird
# abgeschaltet; einer, der zwei Minuten braucht, bleibt.
#
# Wer die Meldung bekommt: Einen fehlgeschlagenen geplanten Lauf meldet GitHub
# der Person, die diese Datei angelegt oder die cron-Zeile zuletzt geändert
# hat, nicht allen Beteiligten. Wer benachrichtigt werden will, committet die
# Änderung an der cron-Zeile also selbst.
#
# Öffentliche Repositories: GitHub schaltet geplante Workflows nach 60 Tagen
# ohne Repository-Aktivität ab. Regelmässig gemergte Update-PRs halten den
# Zeitplan am Leben.

on:
  schedule:
    # 06:17 UTC — in Zürich 08:17 im Sommer, 07:17 im Winter. Nicht zur vollen
    # Stunde, weil GitHub dann am meisten Last hat und Läufe sich verspäten.
    - cron: '17 6 * * *'
  workflow_dispatch:

# Der Lauf liest nur. Keine Schreibrechte, auch nicht auf Umwegen.
permissions:
  contents: read

concurrency:
  group: sicherheit-taeglich
  cancel-in-progress: false

jobs:
  pruefung:
    name: Secret-Scan und Abhängigkeiten
    runs-on: ubuntu-24.04
    steps:
      # Die ganze Historie, nicht nur der letzte Stand: ein Geheimnis, das in
      # einem alten Commit steht, ist im öffentlichen Repository weiter lesbar.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Hält fest, dass wirklich die ganze Historie da ist. Ein flacher Checkout
      # hätte genau einen Commit, und der Scan sähe grün aus, ohne es zu sein.
      - name: Historie vollständig
        run: |
          count=$(git rev-list --count HEAD)
          echo "Commits im Checkout: $count"
          test "$count" -gt 1

      # Binärdatei statt Action, mit geprüfter Prüfsumme aus dem Release.
      # Dieselbe Fassung wie in ci.yml — beide zusammen aktualisieren.
      - name: gitleaks 8.30.1 holen
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      # Ausnahmen stehen einzeln in .gitleaksignore, begründet in docs/SECURITY.md.
      - name: Secret-Scan über alle Commits
        run: ./gitleaks git . --no-banner --redact --gitleaks-ignore-path .gitleaksignore

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Strenger als ci.yml: der tägliche Lauf blockiert schon ab "moderat".
      # Hier geht es nicht darum, einen Commit durchzulassen, sondern darum,
      # eine neue Meldung überhaupt zu bemerken.
      #
      # Ausgenommen ist genau eine Nummer, nicht eine ganze Stufe:
      # GHSA-67mh-4wv8-2f99 (esbuild ≤ 0.24.2 über drizzle-kit) ist in
      # docs/SECURITY.md als nicht anwendbar bewertet und lässt sich mangels
      # Update nicht beheben. Ohne diese Ausnahme wäre der Lauf ab dem ersten
      # Tag rot, und ein täglich rotes Auge sieht die echte Meldung nicht mehr.
      # Fällt der Befund weg, fällt auch das --ignore weg.
      - name: Bekannte Schwachstellen, blockierend ab moderat
        run: bun audit --audit-level=moderate --ignore GHSA-67mh-4wv8-2f99

      # Zur Ansicht in der Laufzusammenfassung, auch die ausgenommene Nummer
      # und alles Niedrige. Der Exit-Code fällt hier bewusst weg; geurteilt
      # wird im Schritt darüber.
      - name: Alle Befunde zur Ansicht
        if: always()
        run: |
          {
            echo '### bun audit, alle Stufen'
            echo ''
            echo '```'
            bun audit 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
